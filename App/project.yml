name: ET
options:
  bundleIdPrefix: xyz.ericsharma
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  ETCore:
    path: ../ETCore
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
settings:
  base:
    DEVELOPMENT_TEAM: 9MY2559FS4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ET:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources]
    dependencies:
      - package: ETCore
      - package: Citadel
      - package: SwiftTerm
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: E.T.
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: E.T. uses the microphone when you tap the mic to dictate text for the terminal.
        NSSpeechRecognitionUsageDescription: E.T. turns your dictation into text on this device. Audio never leaves the device.
        NSLocalNetworkUsageDescription: E.T. connects over SSH to servers on your local network.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ericsharma.et
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
