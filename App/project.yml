name: ET
options:
  bundleIdPrefix: xyz.ericsharma
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  ETCore:
    path: ../ETCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
settings:
  base:
    DEVELOPMENT_TEAM: 9MY2559FS4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ET:
    type: application
    platform: iOS
    # xcodegen picks the build phase by file type, so the asset catalog
    # (app icon) is listed under sources too.
    sources: [Sources, Resources]
    dependencies:
      - package: ETCore
        product: ETCore
      - package: ETCore
        product: ETSSH
      - package: SwiftTerm
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: E.T.
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: E.T. uses the microphone when you tap the mic to dictate text for the terminal.
        NSSpeechRecognitionUsageDescription: E.T. turns your dictation into text on this device. Audio never leaves the device.
        NSLocalNetworkUsageDescription: E.T. connects over SSH to servers on your local network.
        ITSAppUsesNonExemptEncryption: false
        # "Open in E.T." for any file (AirDrop, Files, share sheet): E.T.
        # uploads it and types its path into a window.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.content]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ericsharma.et
        CODE_SIGN_ENTITLEMENTS: ET.entitlements
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
