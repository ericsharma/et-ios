name: ET
options:
  bundleIdPrefix: xyz.ericsharma
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  ETCore:
    path: ../ETCore
  EtLink:
    path: ../Vendor/etd/apple/EtLink
  # Vendored without its build plugin (Vendor/SwiftTerm/PATCHES.md).
  SwiftTerm:
    path: ../Vendor/SwiftTerm
settings:
  base:
    DEVELOPMENT_TEAM: 9MY2559FS4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ET:
    type: application
    platform: iOS
    # xcodegen picks the build phase by file type, so the asset catalog
    # (app icon) is listed under sources too.
    sources: [Sources, Shared, ShareKit, Resources]
    dependencies:
      - target: ETShare
      - package: ETCore
        product: ETCore
      - package: ETCore
        product: ETSSH
      - package: SwiftTerm
      - package: EtLink
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: E.T.
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Short git commit the build was made from (scripts/testflight).
        ETGitCommit: $(ET_GIT_COMMIT)
        # The Keychain group of the iroh key, shared with the extension.
        ETKeychainGroup: $(AppIdentifierPrefix)xyz.ericsharma.et
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: E.T. uses the microphone when you tap the mic to dictate text for the terminal.
        NSSpeechRecognitionUsageDescription: E.T. turns your dictation into text on this device. Audio never leaves the device.
        NSCameraUsageDescription: E.T. uses the camera to scan the QR code that `etd pair` shows.
        NSLocalNetworkUsageDescription: E.T. connects to servers on your local network (SSH, or etd directly).
        # et://pair?t=… from `etd pair` (QR code in the Camera app).
        CFBundleURLTypes:
          - CFBundleURLName: xyz.ericsharma.et.pair
            CFBundleURLSchemes: [et]
        ITSAppUsesNonExemptEncryption: false
        # "Open in E.T." for any file (AirDrop, Files, share sheet): E.T.
        # uploads it and types its path into a window.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.content]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ericsharma.et
        CODE_SIGN_ENTITLEMENTS: ET.entitlements
        CURRENT_PROJECT_VERSION: "1"
        ET_GIT_COMMIT: dev
        MARKETING_VERSION: "0.1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The share sheet's "E.T." (docs/PLAN-files.md F7): files to a machine,
  # optionally into a session. Shares the iroh key (Keychain group) and the
  # App Group with the app.
  ETShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, ShareKit, Shared]
    dependencies:
      - package: ETCore
        product: ETCore
      - package: ETCore
        product: ETSSH
      - package: EtLink
    info:
      path: Generated/Info-share.plist
      properties:
        CFBundleDisplayName: E.T.
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ETGitCommit: $(ET_GIT_COMMIT)
        ETKeychainGroup: $(AppIdentifierPrefix)xyz.ericsharma.et
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Any file: photos, PDFs, anything from Files.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem, SUBQUERY($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.data"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url").@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ericsharma.et.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ETShare.entitlements
        CURRENT_PROJECT_VERSION: "1"
        ET_GIT_COMMIT: dev
        MARKETING_VERSION: "0.1"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
  # The Mac app (docs/PLAN-macos.md): SwiftUI + AppKit, not Catalyst; not
  # sandboxed (it runs etd), shipped Developer ID signed (scripts/mac-release).
  ET-mac:
    type: application
    platform: macOS
    sources: [Mac/Sources, Mac/Resources, Shared]
    dependencies:
      - package: ETCore
        product: ETCore
      - package: ETCore
        product: ETSSH
      - package: SwiftTerm
      - package: EtLink
      - package: ETCore
        product: ETOnboarding
    # etd + etd-ssh (cargo, from Vendor/etd) and the login item's plist.
    postCompileScripts:
      - name: Bundle etd
        script: '"$SRCROOT/../scripts/bundle-etd-mac.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Generated/Info-mac.plist
      properties:
        CFBundleName: E.T.
        CFBundleDisplayName: E.T.
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ETGitCommit: $(ET_GIT_COMMIT)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSMicrophoneUsageDescription: E.T. uses the microphone when you click Dictate to speak text into the terminal.
        NSSpeechRecognitionUsageDescription: E.T. turns your dictation into text on this Mac. Audio never leaves the Mac.
        # Any file or folder dropped on the Dock icon: File → Send File….
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.item]
        # et://pair?t=… from `etd invite`.
        CFBundleURLTypes:
          - CFBundleURLName: xyz.ericsharma.et.mac.pair
            CFBundleURLSchemes: [et]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ericsharma.et.mac
        # Hardened runtime: the microphone needs its entitlement.
        CODE_SIGN_ENTITLEMENTS: Mac/ET-mac.entitlements
        PRODUCT_NAME: E.T.
        ENABLE_HARDENED_RUNTIME: YES
        # The etd build phase runs cargo and writes into the bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # EtLinkFFI (and the bundled etd) are arm64 only: Apple silicon.
        ARCHS: arm64
        CURRENT_PROJECT_VERSION: "1"
        ET_GIT_COMMIT: dev
        MARKETING_VERSION: "0.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
